name: Release

# Jeder Push auf main wird zu einem Release: Version bestimmen, taggen, bauen,
# signieren, veröffentlichen. Die Apps holen sich das Update beim nächsten Start.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'design/**'
      - '**.md'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Prüfen, Version und Tag
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - id: next
        name: Nächste Version bestimmen
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          next=$(node scripts/next-version.mjs "$latest")
          echo "Neueste: ${latest:-keine} → nächste: v$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
      - name: Version schreiben, committen, taggen
        run: |
          node scripts/set-version.mjs "${{ steps.next.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "release: v${{ steps.next.outputs.version }} [skip ci]"
            git push origin HEAD:main
          fi
          git tag -a "${{ steps.next.outputs.tag }}" -m "zentime ${{ steps.next.outputs.version }}"
          git push origin "${{ steps.next.outputs.tag }}"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04: ältere glibc, das AppImage läuft damit auch auf neueren Systemen
          - name: Linux x86_64
            os: ubuntu-22.04
            args: ''
          # Universal-Binary für Apple Silicon und Intel
          - name: macOS universal
            os: macos-latest
            args: '--target universal-apple-darwin'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: 'zentime ${{ needs.version.outputs.version }}'
          releaseBody: |
            Installationshinweise stehen im README (macOS: Gatekeeper, Linux: AppImage/deb).
            Installierte Apps aktualisieren sich beim nächsten Start automatisch.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    name: Veröffentlichen
    needs: [version, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Draft freigeben, damit latest.json für den Updater sichtbar wird
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
